# L2 意图识别向量库种子语料
#
# 设计原则：L2 是 L1（关键词/正则）的补充，只在 L1 未命中时才被调用。
# 因此这里刻意剔除所有能被 L1 关键词直接命中的说法（否则永远走不到 L2，纯属冗余），
# 只保留「自然口语、整句、带场景、且不含 L1 触发词」的表达——例如用「包裹/没动静」代替
# 「订单/物流」、用「下错单/作废」代替「取消订单」、用「说道说道/提提意见」代替「投诉」。
# 这类说法正是 L1 模板难以命中、需向量语义兜底的部分。
# 冗余护栏由 IntentRouterSeedExamplesTest#shouldNotOverlapWithL1Rules 离线校验。
#
# key 为 IntentCategory 的 code（见 IntentCategory 枚举），value 为该意图的高频口语问句。
intent:
  router:
    seed-examples:
      order_query:
        - "我上周买的东西还没动静，帮我瞅瞅"
        - "那个包裹现在走到哪一步了"
        - "之前定的几件东西都发出去了吗"
        - "看看我最近都买了些啥"
        - "我有一个包裹一直没动静"
        - "帮我翻翻我之前买的东西"
      order_cancel:
        - "那个单子帮我作废了吧"
        - "有一单下错了，帮我撤掉"
        - "刚提交的那个单子帮我撤了"
        - "有个单子操作错了，麻烦帮我作废"
        - "这单不想要了，帮我收回去"
      order_create:
        - "这个看着不错，帮我弄一件"
        - "就它了，帮我拿下"
        - "相中一件，帮我安排拿下"
        - "看中这个了，想收一件"
        - "选好了，帮我打包带走"
      ticket_submit:
        - "我对这次的购物体验很不满意，得说道说道"
        - "收到的和页面差太多了，得给你们提提意见"
        - "有事要找你们人工反映个问题"
        - "有个事儿必须找你们当面讲讲清楚"
        - "这次我必须给你们个差评说法"
      ticket_query:
        - "我上次反映的事儿有下文了吗"
        - "之前让你们看的事儿，有回音了没"
        - "我报给你们的那个问题，现在什么情况"
        - "我捅上去的那事儿，你们内部怎么说的"
        - "之前提的问题，有人跟进没"
      ticket_cancel:
        - "之前那个事儿不用你们管了，帮我收回来"
        - "我反映的问题撤了，不用处理了"
        - "那个事儿我不追究了，帮我撤回"
        - "我捅上去的事儿，算了不弄了"
      ticket_modify:
        - "我之前说的那个情况，还有两点要补充"
        - "我反映的内容漏了一条，帮我加上"
        - "之前讲的情况有点出入，帮我改改说法"
      after_sale:
        - "这东西我用不惯，想原路退回"
        - "包裹拆开发现坏了，这种情况怎么处理"
        - "商家发错货了，我想讨个说法"
        - "大小不合适，能换个合适的不"
        - "东西有质量问题，不能就这么算了"
        - "收据这事儿帮我弄一下，公司那边要用"
      product_consult:
        - "这一款跟另一款摆一起看"
        - "最近有啥划算的可以囤"
        - "这款适合什么人使"
        - "同一个牌子新旧款差别大吗"
        - "囤货的话囤什么比较值"
        - "给长辈挑一个，挑什么好"
      general_info:
        - "这周末适合洗车吗"
        - "明早出门用带伞不"
        - "这段路节假日堵得厉害吗"
      greeting:
        - "在的呢"
        - "忙不忙"
        - "吃了吗"
        - "活儿多不"
      unknown:
        - "你能干啥"
        - "你都会什么呀"
        - "我问个事儿啊"
        - "说了你也不懂"
        - "你谁啊"
        - "我该怎么用你"
