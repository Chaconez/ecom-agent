server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 → 后端（host 网络模式，监听宿主 8094）
    # host.docker.internal 由容器启动参数 --add-host host.docker.internal:host-gateway 注入
    # （对应 docker0 网关，即宿主回环）。后端改端口时同步改这里。
    location /api/ {
        proxy_pass http://host.docker.internal:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 连接头置空以支持 keep-alive + chunked 流式传输
        proxy_set_header Connection '';

        # 管理端轮询为普通短请求，放宽超时即可（保留 SSE 兼容配置，
        # 便于后续管理端接入实时推送时无需再改 nginx）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
