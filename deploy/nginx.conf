server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # SPA 路由回退
    # index.html 必须 no-store：Safari 对无缓存头的 HTML 会启发式缓存，
    # 发新版后用户强刷也拿不到新页面（表现为登录 Load failed / 旧版 API 地址）。
    # /assets/ 文件名带 hash，走下面的 30d immutable，不受影响。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # 静态资源缓存（带 hash 的文件名）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端运行日志（运维诊断用，只读挂载 /logs）
    location /logs/ {
        alias /logs/;
        add_header Cache-Control "no-store";
    }

    # API 反向代理 → 后端（host 网络模式，监听宿主 8094）
    # host.docker.internal 由容器启动参数 --add-host host.docker.internal:host-gateway 注入
    # （对应 docker0 网关，即宿主回环）。后端改端口时同步改这里。
    location /api/ {
        proxy_pass http://host.docker.internal:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 连接头置空以支持 keep-alive + chunked 流式传输
        proxy_set_header Connection '';

        # SSE 流式对话关键配置：
        # 关闭缓冲让事件实时推送给前端；读写超时放宽到 10 分钟，
        # 覆盖本地 LLM 单轮 1-3 分钟 + 多 Agent 串行调用的最坏情况
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
